<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada | Jaider Betancur</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050507">
  <meta name="color-scheme" content="dark light">

  <!-- Favicon: mismo símbolo de código </> del portafolio -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C0C10'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='12.5' fill='none' stroke='%237C5CFF' stroke-opacity='.55' stroke-width='3'/%3E%3Cpath d='M23 22L13 32l10 10M41 22l10 10-10 10' fill='none' stroke='%23A795FF' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M35.5 17.5L28.5 46.5' stroke='%237C5CFF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Mismo tema que el portafolio (guardado o preferencia del sistema) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --surface: #0C0C10;
      --border: #17171E;
      --text: #EDEDF2;
      --muted: #7A7A88;
      --accent: #7C5CFF;
      --accent-soft: #A795FF;
      --accent-text: #7C5CFF;
      --glow: #1E1440;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #F7F7FA;
      --surface: #FFFFFF;
      --border: #E4E4EC;
      --text: #111118;
      --muted: #5E5E6E;
      --glow: #E9E3FF;
      --accent-soft: #5B3FD9;
      --accent-text: #6143E8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(ellipse at 50% 100%, var(--glow), transparent 60%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124, 92, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 92, 255, 0.04) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse at top, #000 20%, transparent 70%);
      mask-image: radial-gradient(ellipse at top, #000 20%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; }
    ::selection { background: var(--accent); color: #fff; }

    main { text-align: center; max-width: 560px; width: 100%; animation: rise .8s ease both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-soft);
      margin-bottom: 8px;
      display: inline-block;
    }
    .code {
      font-size: clamp(88px, 22vw, 168px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--accent-text);
      text-shadow: 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    h1 {
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 8px 0 12px;
    }
    .desc { color: var(--muted); margin-bottom: 28px; }

    /* Línea tipo terminal con la ruta que no existe */
    .terminal {
      font-family: var(--mono);
      font-size: 13px;
      text-align: left;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 32px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .terminal .prompt { color: var(--accent-soft); }
    .terminal .err { color: var(--text); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px var(--accent); background: #8B6FFF; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow" id="t-eyebrow">Error</span>
    <p class="code" aria-hidden="true">404</p>
    <h1 id="t-title">Esta página no existe</h1>
    <p class="desc" id="t-desc">La ruta que buscas no existe o fue movida. Vuelve al inicio para ver mi portafolio.</p>

    <div class="terminal" aria-hidden="true">
      <div><span class="prompt">&gt;</span> cd <span id="path">/ruta</span></div>
      <div class="err">bash: no such file or directory</div>
    </div>

    <a class="btn" id="home" href="/">← Volver al inicio</a>
  </main>

  <script>
    // Muestra la ruta solicitada (como texto, nunca como HTML)
    document.getElementById('path').textContent = location.pathname;

    // GitHub Pages sirve este archivo para CUALQUIER ruta inexistente, también las anidadas
    // (/repo/a/b), así que el enlace al inicio no puede ser relativo.
    //  - Sitio de proyecto (usuario.github.io/repo/): se usa la primera carpeta como raíz.
    //  - Sitio de usuario (usuario.github.io) o dominio propio: la raíz es "/".
    // Si tu repositorio se llama <usuario>.github.io, cambia SITE_ROOT a '/'.
    var SITE_ROOT = null; // null = detección automática
    var root = SITE_ROOT;
    if (root === null) {
      var first = location.pathname.split('/')[1];
      var isGithubHost = /\.github\.io$/.test(location.hostname);
      root = (isGithubHost && first) ? '/' + first + '/' : '/';
    }
    // Idioma: el de la carpeta que se pidió (/es/... o /en/...); si no, el recordado o el del navegador
    var lang = /\/en(\/|$)/.test(location.pathname) ? 'en' : /\/es(\/|$)/.test(location.pathname) ? 'es' : null;
    if (!lang) {
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (lang !== 'es' && lang !== 'en') {
        var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'es';
        lang = /^es/i.test(nav) ? 'es' : 'en';
      }
    }
    var T = {
      es: { title: '404 — Página no encontrada | Jaider Betancur', eyebrow: 'Error', h1: 'Esta página no existe',
            desc: 'La ruta que buscas no existe o fue movida. Vuelve al inicio para ver mi portafolio.', home: '← Volver al inicio' },
      en: { title: '404 — Page not found | Jaider Betancur', eyebrow: 'Error', h1: 'This page does not exist',
            desc: 'The page you are looking for does not exist or has moved. Go back home to see my portfolio.', home: '← Back to home' }
    }[lang];
    document.documentElement.lang = lang;
    document.title = T.title;
    document.getElementById('t-eyebrow').textContent = T.eyebrow;
    document.getElementById('t-title').textContent = T.h1;
    document.getElementById('t-desc').textContent = T.desc;
    var home = document.getElementById('home');
    home.textContent = T.home;
    // Lleva al portafolio en el mismo idioma (en file:// una carpeta no abre su index.html)
    home.setAttribute('href', root + lang + '/' + (location.protocol === 'file:' ? 'index.html' : ''));
  </script>
</body>
</html>
