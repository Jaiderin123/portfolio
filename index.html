  <link rel="canonical" href="https://jaiderin123.github.io/portfolio/">
  <link rel="alternate" hreflang="es" href="https://jaiderin123.github.io/portfolio/es/">
  <link rel="alternate" hreflang="en" href="https://jaiderin123.github.io/portfolio/en/">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C0C10'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='12.5' fill='none' stroke='%237C5CFF' stroke-opacity='.55' stroke-width='3'/%3E%3Cpath d='M23 22L13 32l10 10M41 22l10 10-10 10' fill='none' stroke='%23A795FF' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M35.5 17.5L28.5 46.5' stroke='%237C5CFF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (lang !== 'es' && lang !== 'en') {
        var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
        lang = /^es/i.test(nav) ? 'es' : 'en';
      }
      // En file:// una carpeta no abre su index.html
      location.replace(lang + '/' + (location.protocol === 'file:' ? 'index.html' : '') + location.search + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=es/"></noscript>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #050507; color: #EDEDF2;
           font-family: 'Inter', system-ui, -apple-system, sans-serif; text-align: center; }
    h1 { font-size: clamp(26px, 5vw, 40px); letter-spacing: -0.02em; margin-bottom: 8px; }
    p { color: #7A7A88; margin-bottom: 24px; }
    .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    a { padding: 13px 26px; border-radius: 999px; border: 1px solid #7C5CFF; color: #EDEDF2; text-decoration: none; font-weight: 600; transition: background .2s ease; }
